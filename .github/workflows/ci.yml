name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # An ephemeral Postgres so CI never depends on a cloud database. Tests create
    # their own isolated schema inside it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metrics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metrics_test
      DEFAULT_TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-level exhaustiveness (E5-S4) is enforced here: adding a canonical
      # status without handling it fails this step.
      - name: Typecheck
        run: pnpm typecheck

      # Unit + integration + property (reconciliation) + guards
      # (mapping-coverage, single-implementation) all run here and gate merge.
      - name: Test
        run: pnpm test
